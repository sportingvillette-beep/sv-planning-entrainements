name: Scrape FFHB

on:
  schedule:
    # Tous les soirs à ~2h du matin (heure de Paris). GitHub Actions n'évalue les
    # cron que sur la branche par défaut (main) — ce déclenchement automatique ne
    # démarrera donc qu'une fois ce workflow mergé sur main.
    # Le cron GitHub Actions est en UTC sans gestion du changement d'heure : 1h00 UTC
    # correspond à 2h00 (hiver, CET) ou 3h00 (été, CEST) heure de Paris — couvre
    # aussi le week-end (les matchs du dimanche sont scrapés dans la nuit de
    # dimanche à lundi, remplace l'ancien cron hebdomadaire du dimanche soir).
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      teams:
        description: "IDs équipes à rafraîchir, séparés par des virgules (vide = toutes)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape-ffhb
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Mettre à jour le mapping équipes (nouvelles équipes uniquement)
        run: python scraper/scrape_ffhb_club.py sync-mapping --mapping-dir scraper

      - name: Scraper calendrier/classement
        env:
          # Synchronise chaque match vers la sheet "Matchs" (Web App Apps Script, voir
          # apps-script/Code.gs). No-op silencieux tant que ces secrets ne sont pas définis
          # (Settings > Secrets and variables > Actions).
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_WEBAPP_SECRET: ${{ secrets.SHEET_WEBAPP_SECRET }}
        run: |
          python scraper/scrape_ffhb_club.py scrape \
            --mapping-dir scraper \
            --outdir data \
            --teams "${{ github.event.inputs.teams }}"

      - name: Committer les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ scraper/team_mapping.csv
          if git diff --cached --quiet; then
            echo "Rien de nouveau à committer."
          else
            git commit -m "chore: mise à jour automatique FFHB ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push origin HEAD:${{ github.ref_name }}
          fi
